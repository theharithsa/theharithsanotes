name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run test:cms
      - name: Preserve actual test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-test-results-${{ github.run_attempt }}
          path: |
            artifacts/site-tests.xml
            artifacts/cms-tests.xml
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build:server
      - name: Run npm audit --audit-level=high
        run: |
          report="$RUNNER_TEMP/npm-audit.json"
          if npm audit --audit-level=high --json > "$report"; then
            echo "Required npm audit passed."
          else
            audit_status=$?
            cat "$report"
            if [ "$audit_status" -ne 1 ]; then exit "$audit_status"; fi
            node scripts/check-npm-audit-exception.mts "$report"
          fi
