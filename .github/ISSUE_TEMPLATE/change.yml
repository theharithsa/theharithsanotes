name: Change request
description: Maintenance, documentation or infrastructure change
title: "[Change] "
labels: ["type: task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and scope
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Tests, observability and release impact
      description: Record unknown decisions; never include secrets or customer data.
